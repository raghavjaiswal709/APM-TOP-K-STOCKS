version: '3.8'

# Standalone Instance Configuration
# Each instance is completely independent with its own database, cache, and services
# No inter-instance communication or dependencies
# Copy this file to each instance directory and customize .env file

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js + React)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ${INSTANCE_ID}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      # Public URLs for browser-side requests (from server .env)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_MARKET_DATA_API=${NEXT_PUBLIC_MARKET_DATA_API}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
      - NEXT_PUBLIC_FYERS_SOCKET_URL=${NEXT_PUBLIC_FYERS_SOCKET_URL}
      - NEXT_PUBLIC_FYERS_SERVICE_5001_URL=${NEXT_PUBLIC_FYERS_SERVICE_5001_URL}
      - NEXT_PUBLIC_LIVE_MARKET_SOCKET_URL=${NEXT_PUBLIC_LIVE_MARKET_SOCKET_URL}
      - NEXT_PUBLIC_PREDICTION_API=${NEXT_PUBLIC_PREDICTION_API}
      - NEXT_PUBLIC_PREDICTION_ENABLED=${NEXT_PUBLIC_PREDICTION_ENABLED}
      - NEXT_PUBLIC_PREDICTION_POLL_INTERVAL=${NEXT_PUBLIC_PREDICTION_POLL_INTERVAL}
      - NEXT_PUBLIC_PREDICTION_TOTAL_DURATION=${NEXT_PUBLIC_PREDICTION_TOTAL_DURATION}
      # Feature flags and app config
      - NEXT_PUBLIC_ENABLE_PREDICTIONS=${NEXT_PUBLIC_ENABLE_PREDICTIONS}
      - NEXT_PUBLIC_ENABLE_LIVE_MARKET=${NEXT_PUBLIC_ENABLE_LIVE_MARKET}
      - NEXT_PUBLIC_ENABLE_LSTMAE=${NEXT_PUBLIC_ENABLE_LSTMAE}
      - NEXT_PUBLIC_GTT_API_URL=${NEXT_PUBLIC_GTT_API_URL}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION}
      - NEXT_PUBLIC_TRADING_START=${NEXT_PUBLIC_TRADING_START}
      - NEXT_PUBLIC_TRADING_END=${NEXT_PUBLIC_TRADING_END}
      - NEXT_PUBLIC_TIMEZONE=${NEXT_PUBLIC_TIMEZONE}
      # Charts and data behavior
      - NEXT_PUBLIC_CHART_HEIGHT=${NEXT_PUBLIC_CHART_HEIGHT}
      - NEXT_PUBLIC_CHART_THEME=${NEXT_PUBLIC_CHART_THEME}
      - NEXT_PUBLIC_CHART_RESPONSIVE=${NEXT_PUBLIC_CHART_RESPONSIVE}
      - NEXT_PUBLIC_DATA_CACHE_TTL=${NEXT_PUBLIC_DATA_CACHE_TTL}
      - NEXT_PUBLIC_DATA_MAX_HISTORICAL=${NEXT_PUBLIC_DATA_MAX_HISTORICAL}
      - NEXT_PUBLIC_FORCE_MARKET_OPEN=${NEXT_PUBLIC_FORCE_MARKET_OPEN}
      # Internal service URL for server-side calls inside container
      - BACKEND_URL=http://backend:5002
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ${INSTANCE_ID}-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=frontend"

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND API (NestJS)
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ${INSTANCE_ID}-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      # Use external PostgreSQL from server .env
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}
      - REDIS_URL=redis://redis:6379
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_ID=${FYERS_SECRET_ID}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN}
      - FYERS_REDIRECT_URI=${FYERS_REDIRECT_URI}
      # CORS and security settings
      - CORS_ORIGIN=${CORS_ORIGIN}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS}
      # Logging and rate limiting
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      # JWT and timezone
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - TZ=${TZ}
      - FORCE_MARKET_OPEN=${FORCE_MARKET_OPEN}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ${INSTANCE_ID}-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=backend"

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE (PostgreSQL)
  # ═══════════════════════════════════════════════════════════════════════════
  db:
    image: postgres:15-alpine
    container_name: ${INSTANCE_ID}-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Kolkata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ${INSTANCE_ID}-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=database"

  # ═══════════════════════════════════════════════════════════════════════════
  # CACHE (Redis)
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: ${INSTANCE_ID}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - ${INSTANCE_ID}-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=cache"

  # ═══════════════════════════════════════════════════════════════════════════
  # FYERS SERVICE 5001 (Python - AsyncIO/Uvicorn)
  # Live market data feed with WebSocket support
  # ═══════════════════════════════════════════════════════════════════════════
  fyers-5001:
    build:
      context: .
      dockerfile: Dockerfile.python-5001
    container_name: ${INSTANCE_ID}-fyers-5001
    restart: unless-stopped
    ports:
      - "${FYERS_5001_PORT}:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_ID=${FYERS_SECRET_ID}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - ./apps/backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ${INSTANCE_ID}-network
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=fyers-5001"

  # ═══════════════════════════════════════════════════════════════════════════
  # FYERS SERVICE 5010 (Python - Eventlet)
  # Multi-view market data aggregation
  # ═══════════════════════════════════════════════════════════════════════════
  fyers-5010:
    build:
      context: .
      dockerfile: Dockerfile.python-5010
    container_name: ${INSTANCE_ID}-fyers-5010
    restart: unless-stopped
    ports:
      - "${FYERS_5010_PORT}:5010"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_ID=${FYERS_SECRET_ID}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - ./apps/backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ${INSTANCE_ID}-network
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=fyers-5010"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  frontend-node-modules:
    driver: local
  frontend-next:
    driver: local

networks:
  ${INSTANCE_ID}-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 9000
