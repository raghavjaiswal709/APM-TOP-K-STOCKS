version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # ⚙️ NestJS Backend API (Port 5002)
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: daks-backend
    restart: unless-stopped
    ports:
      - "5002:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5002
      - NODE_ENV=development
      - PYTHON_SERVICE_HOST=host.docker.internal
    env_file:
      - apps/backend/.env
    volumes:
      - ./apps/backend/data:/app/data
    networks:
      - daks-network

  # ═══════════════════════════════════════════════════════════════════════════
  # 🖥️ Next.js Frontend (Port 3000)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: daks-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Python management API — Tailscale IP, port 6977.
      - PYTHON_API_URL=http://100.93.172.21:6977

      # Socket / service URLs (browser-side)
      - NEXT_PUBLIC_FYERS_SOCKET_URL=http://100.93.172.21:5001
      - NEXT_PUBLIC_FYERS_SERVICE_5001_URL=http://100.93.172.21:5001
      - NEXT_PUBLIC_LIVE_MARKET_SOCKET_URL=http://100.93.172.21:5010
      - NEXT_PUBLIC_SOCKET_URL=http://100.93.172.21:5001

      # Backend API URLs (browser-accessible)
      - NEXT_PUBLIC_API_URL=http://100.93.172.21:5002
      - NEXT_PUBLIC_BACKEND_URL=http://100.93.172.21:5002
      - NEXT_PUBLIC_MARKET_DATA_API=http://100.93.172.21:5002/api
      - NEXT_PUBLIC_GTT_API_URL=http://100.93.172.21:5002

      # Internal server-side URL (container-to-container via Docker DNS)
      - BACKEND_URL=http://backend:5002
    env_file:
      - apps/frontend/.env
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
      - /var/run/docker.sock:/var/run/docker.sock
      - ./apps/backend/data/config.ini:/fyers-config/config.ini
    depends_on:
      - backend
    networks:
      - daks-network

  # ═══════════════════════════════════════════════════════════════════════════
  # 🐍 Python Fyers Service A - ASGI/Uvicorn (Port 5001)
  # ═══════════════════════════════════════════════════════════════════════════
  fyers-5001:
    build:
      context: .
      dockerfile: Dockerfile.python-5001
    container_name: daks-fyers-5001
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - apps/backend/.env
    volumes:
      - ./apps/backend/data:/app/data
    networks:
      - daks-network

  # ═══════════════════════════════════════════════════════════════════════════
  # 🐍 Python Fyers Service B - Eventlet (Port 5010)
  # ═══════════════════════════════════════════════════════════════════════════
  fyers-5010:
    build:
      context: .
      dockerfile: Dockerfile.python-5010
    container_name: daks-fyers-5010
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - apps/backend/.env
    volumes:
      - ./apps/backend/data:/app/data
    networks:
      - daks-network

networks:
  daks-network:
    driver: bridge
