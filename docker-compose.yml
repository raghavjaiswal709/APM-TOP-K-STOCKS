version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # ⚙️ NestJS Backend API (Port 5002)
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: daks-backend
    restart: unless-stopped
    ports:
      - "5002:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5002
      - NODE_ENV=development
    env_file:
      - apps/backend/.env
    volumes:
      - ./apps/backend/data:/app/data
    networks:
      - daks-network

  # ═══════════════════════════════════════════════════════════════════════════
  # 🖥️ Next.js Frontend (Port 3000)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: daks-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── NEXT_PUBLIC_ vars are the SINGLE SOURCE OF TRUTH for socket URLs. ──
      # Browser-side code reads ONLY these — no IPs are ever hardcoded in TS/JS.
      #
      # TO USE LAPTOP'S LOCAL DOCKER (both running on same machine):
      #   NEXT_PUBLIC_FYERS_SOCKET_URL=http://localhost:5001
      #   NEXT_PUBLIC_LIVE_MARKET_SOCKET_URL=http://localhost:5010
      #
      # TO USE REMOTE SERVER (current setting — laptop browser → server):
      #   NEXT_PUBLIC_FYERS_SOCKET_URL=http://100.93.172.21:5001
      #   NEXT_PUBLIC_LIVE_MARKET_SOCKET_URL=http://100.93.172.21:5010
      #
      # Change these two lines + rebuild frontend to switch between sources.
      - NEXT_PUBLIC_FYERS_SOCKET_URL=http://100.93.172.21:5001
      - NEXT_PUBLIC_FYERS_SERVICE_5001_URL=http://100.93.172.21:5001
      - NEXT_PUBLIC_LIVE_MARKET_SOCKET_URL=http://100.93.172.21:5010
      
      - NEXT_PUBLIC_SOCKET_URL=http://100.93.172.21:5001
      # To use your laptop's local Docker:

      



      # Backend API URLs (browser-accessible)
      - NEXT_PUBLIC_API_URL=http://100.93.172.21:5002
      - NEXT_PUBLIC_BACKEND_URL=http://100.93.172.21:5002
      - NEXT_PUBLIC_MARKET_DATA_API=http://100.93.172.21:5002/api
      - NEXT_PUBLIC_GTT_API_URL=http://100.93.172.21:5002

      # Internal server-side URL (container-to-container)
      - BACKEND_URL=http://backend:5002
    env_file:
      - apps/frontend/.env
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - daks-network

  # ═══════════════════════════════════════════════════════════════════════════
  # 🐍 Python Fyers Service A - ASGI/Uvicorn (Port 5001)
  # PORT env var controls which port uvicorn binds to (reads via os.getenv).
  # ═══════════════════════════════════════════════════════════════════════════
  fyers-5001:
    build:
      context: .
      dockerfile: Dockerfile.python-5001
    container_name: daks-fyers-5001
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - apps/backend/.env
    volumes:
      - ./apps/backend/data:/app/data
    networks:
      - daks-network

  # ═══════════════════════════════════════════════════════════════════════════
  # 🐍 Python Fyers Service B - Eventlet (Port 5010)
  # ═══════════════════════════════════════════════════════════════════════════
  fyers-5010:
    build:
      context: .
      dockerfile: Dockerfile.python-5010
    container_name: daks-fyers-5010
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - apps/backend/.env
    volumes:
      - ./apps/backend/data:/app/data
    networks:
      - daks-network

networks:
  daks-network:
    driver: bridge
