# ═══════════════════════════════════════════════════════════════════════════════
# DAKS TOP-K STOCKS - Multi-Instance Configuration (External PostgreSQL)
# ═══════════════════════════════════════════════════════════════════════════════
#
# This configuration connects to an EXTERNAL PostgreSQL database running on the
# server at 100.93.172.21:5432, instead of creating its own PostgreSQL container.
#
# Each instance has:
#   - Its own Frontend (Next.js)
#   - Its own Backend (NestJS)
#   - Its own Redis (for caching)
#   - Its own Fyers services (Python)
#   - Shared access to external PostgreSQL
#
# Copy this file to each instance directory as docker-compose.standalone.yml
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js + React)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ../../
      dockerfile: Dockerfile.frontend
    container_name: ${INSTANCE_ID}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Browser-accessible URLs (use server IP)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_GTT_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_FYERS_SERVICE_5001_URL=${NEXT_PUBLIC_FYERS_SERVICE_5001_URL}
      - NEXT_PUBLIC_FYERS_SERVICE_5010_URL=${NEXT_PUBLIC_FYERS_SERVICE_5010_URL}
      - NEXT_PUBLIC_FYERS_SOCKET_URL=${NEXT_PUBLIC_FYERS_SOCKET_URL}
      - NEXT_PUBLIC_LIVE_MARKET_SOCKET_URL=${NEXT_PUBLIC_LIVE_MARKET_SOCKET_URL}
      # Server-side (internal Docker network)
      - BACKEND_URL=http://backend:5002
      - NODE_ENV=${NODE_ENV:-production}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=frontend"

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND API (NestJS)
  # Connects to EXTERNAL PostgreSQL at 100.93.172.21:5432
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ../../
      dockerfile: Dockerfile.backend
    container_name: ${INSTANCE_ID}-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5002
      - NODE_ENV=${NODE_ENV:-production}
      # Database connection - EXTERNAL PostgreSQL
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      # Redis - internal Docker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      # Fyers credentials
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_ID=${FYERS_SECRET_ID}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN}
      - FYERS_REDIRECT_URI=${FYERS_REDIRECT_URI}
      # External API URLs
      - SIPR_API_URL=${SIPR_API_URL:-http://100.93.172.21:8510}
      - PREDICTION_API_URL=${PREDICTION_API_URL:-http://100.93.172.21:5112}
      - PREMARKET_API_URL=${PREMARKET_API_URL:-http://100.93.172.21:5717}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/predictions/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=backend"

  # ═══════════════════════════════════════════════════════════════════════════
  # CACHE (Redis) - Internal per instance
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: ${INSTANCE_ID}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=cache"

  # ═══════════════════════════════════════════════════════════════════════════
  # FYERS SERVICE 5001 (Python - AsyncIO/Uvicorn)
  # Live market data feed with WebSocket support
  # ═══════════════════════════════════════════════════════════════════════════
  fyers-5001:
    build:
      context: ../../
      dockerfile: Dockerfile.python-5001
    container_name: ${INSTANCE_ID}-fyers-5001
    restart: unless-stopped
    ports:
      - "${FYERS_5001_PORT}:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_ID=${FYERS_SECRET_ID}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN}
      # Database - EXTERNAL PostgreSQL
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - internal
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=fyers-5001"

  # ═══════════════════════════════════════════════════════════════════════════
  # FYERS SERVICE 5010 (Python - Eventlet)
  # Multi-view market data aggregation
  # ═══════════════════════════════════════════════════════════════════════════
  fyers-5010:
    build:
      context: ../../
      dockerfile: Dockerfile.python-5010
    container_name: ${INSTANCE_ID}-fyers-5010
    restart: unless-stopped
    ports:
      - "${FYERS_5010_PORT}:5010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - FYERS_CLIENT_ID=${FYERS_CLIENT_ID}
      - FYERS_SECRET_ID=${FYERS_SECRET_ID}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN}
      # Database - EXTERNAL PostgreSQL
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - internal
    labels:
      - "com.daks.instance=${INSTANCE_ID}"
      - "com.daks.service=fyers-5010"

# ═══════════════════════════════════════════════════════════════════════════════
# VOLUMES - Only Redis data (PostgreSQL is external)
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  redis-data:
    driver: local
  frontend-node-modules:
    driver: local
  frontend-next:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  internal:
    name: ${INSTANCE_ID}-network
    driver: bridge
